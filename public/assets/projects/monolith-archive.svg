<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 750" width="1200" height="750" fill="none">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#08080C" />
      <stop offset="50%" stop-color="#0E0E14" />
      <stop offset="100%" stop-color="#060608" />
    </linearGradient>

    <!-- Subtle Blue Radial Glow for Featured Center Card -->
    <radialGradient id="center-glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="rgba(184, 201, 255, 0.15)" />
      <stop offset="100%" stop-color="rgba(184, 201, 255, 0)" />
    </radialGradient>

    <!-- Linear Metallic Accent -->
    <linearGradient id="blue-accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#B8C9FF" />
      <stop offset="100%" stop-color="#7096FF" />
    </linearGradient>

    <linearGradient id="card-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="rgba(255, 255, 255, 0.06)" />
      <stop offset="100%" stop-color="rgba(255, 255, 255, 0.02)" />
    </linearGradient>

    <linearGradient id="monolith-face" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="rgba(255, 255, 255, 0.22)" />
      <stop offset="100%" stop-color="rgba(184, 201, 255, 0.05)" />
    </linearGradient>

    <!-- Grid Pattern -->
    <pattern id="arch-grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="rgba(255, 255, 255, 0.04)" stroke-width="1" />
      <circle cx="0" cy="0" r="1" fill="rgba(184, 201, 255, 0.15)" />
    </pattern>
  </defs>

  <!-- Deep Canvas Background -->
  <rect width="1200" height="750" fill="url(#bg-grad)" />

  <!-- Blueprint Grid Overlay -->
  <rect width="1200" height="750" fill="url(#arch-grid)" />

  <!-- Center Ambient Light -->
  <circle cx="600" cy="380" r="380" fill="url(#center-glow)" />

  <!-- Browser Chrome Top Bar -->
  <rect x="0" y="0" width="1200" height="54" fill="#0A0A0F" />
  <line x1="0" y1="54" x2="1200" y2="54" stroke="rgba(255, 255, 255, 0.09)" stroke-width="1" />

  <!-- Window Dots -->
  <circle cx="36" cy="27" r="5" fill="rgba(255, 255, 255, 0.2)" />
  <circle cx="56" cy="27" r="5" fill="rgba(255, 255, 255, 0.15)" />
  <circle cx="76" cy="27" r="5" fill="rgba(255, 255, 255, 0.1)" />

  <!-- Header Center Title -->
  <text x="600" y="32" fill="#E4E4E7" font-family="'Space Grotesk', system-ui, sans-serif" font-size="12" font-weight="600" letter-spacing="3" text-anchor="middle">
    EXP 04 — MONOLITH ARCHIVE // PRODUCT SUITE
  </text>

  <!-- Header Right Badge -->
  <rect x="1030" y="16" width="134" height="22" rx="11" fill="rgba(184, 201, 255, 0.08)" stroke="rgba(184, 201, 255, 0.25)" stroke-width="1" />
  <circle cx="1046" cy="27" r="3.5" fill="#B8C9FF" />
  <text x="1058" y="31" fill="#B8C9FF" font-family="'Space Grotesk', monospace" font-size="9" font-weight="600" letter-spacing="1.5">
    STOREFRONT 2025
  </text>

  <!-- Main Showcase Container -->
  <!-- Subtle Crosshairs -->
  <line x1="160" y1="380" x2="1040" y2="380" stroke="rgba(255, 255, 255, 0.04)" stroke-dasharray="6 6" />
  <line x1="600" y1="90" x2="600" y2="670" stroke="rgba(255, 255, 255, 0.04)" stroke-dasharray="6 6" />

  <!-- Left Product Card (Card A) -->
  <g transform="translate(140, 160)">
    <rect width="250" height="380" rx="14" fill="#0C0D12" stroke="rgba(255, 255, 255, 0.1)" stroke-width="1.2" />
    <!-- Thumbnail Image Area -->
    <rect x="20" y="20" width="210" height="210" rx="8" fill="#13141C" stroke="rgba(255, 255, 255, 0.06)" />
    <!-- Geometric Specimen Wireframe -->
    <circle cx="125" cy="125" r="55" stroke="rgba(255, 255, 255, 0.2)" stroke-width="1.5" stroke-dasharray="4 4" />
    <polygon points="125,75 170,150 80,150" stroke="rgba(184, 201, 255, 0.4)" stroke-width="1.5" fill="rgba(184, 201, 255, 0.04)" />
    <!-- Card Info -->
    <text x="24" y="260" fill="#71717A" font-family="'Space Grotesk', monospace" font-size="10" letter-spacing="1.5">SPECIMEN // 001</text>
    <text x="24" y="284" fill="#FFFFFF" font-family="'Space Grotesk', sans-serif" font-size="16" font-weight="600">Aero Prism V1</text>
    <text x="24" y="308" fill="#A1A1AA" font-family="'Space Grotesk', sans-serif" font-size="12">Sculptural Acoustic Core</text>
    <line x1="24" y1="326" x2="226" y2="326" stroke="rgba(255, 255, 255, 0.08)" />
    <text x="24" y="352" fill="#FFFFFF" font-family="'Space Grotesk', monospace" font-size="14" font-weight="700">$340</text>
    <rect x="156" y="336" width="70" height="24" rx="12" fill="rgba(255, 255, 255, 0.08)" stroke="rgba(255, 255, 255, 0.2)" />
    <text x="191" y="351" fill="#FFFFFF" font-family="'Space Grotesk', sans-serif" font-size="10" font-weight="600" text-anchor="middle">VIEW</text>
  </g>

  <!-- Center Featured Product Card (Card B - Highlighted) -->
  <g transform="translate(440, 120)">
    <!-- Card Glow & Frame -->
    <rect width="320" height="460" rx="18" fill="#101118" stroke="#B8C9FF" stroke-width="1.6" />
    <!-- Top Indicator -->
    <rect x="24" y="22" width="86" height="18" rx="9" fill="rgba(184, 201, 255, 0.15)" />
    <text x="67" y="34" fill="#B8C9FF" font-family="'Space Grotesk', monospace" font-size="8" font-weight="700" letter-spacing="1.5" text-anchor="middle">
      FEATURED DROP
    </text>

    <!-- Main Specimen Visual Frame -->
    <rect x="24" y="52" width="272" height="250" rx="12" fill="#090A0E" stroke="rgba(255, 255, 255, 0.08)" />
    <!-- Architectural Monolith 3D Form -->
    <g transform="translate(160, 175)">
      <!-- Isometric Monolith Block -->
      <polygon points="0,-75 65,-35 0,5 -65,-35" fill="url(#monolith-face)" stroke="#B8C9FF" stroke-width="1.6" />
      <polygon points="0,5 65,-35 65,55 0,95" fill="rgba(184, 201, 255, 0.12)" stroke="#B8C9FF" stroke-width="1.6" />
      <polygon points="-65,-35 0,5 0,95 -65,55" fill="rgba(255, 255, 255, 0.05)" stroke="rgba(255, 255, 255, 0.35)" stroke-width="1.6" />
      <!-- Interior Coordinate Lines -->
      <circle cx="0" cy="10" r="28" stroke="rgba(184, 201, 255, 0.5)" stroke-width="1" stroke-dasharray="3 3" />
      <circle cx="0" cy="10" r="4" fill="#B8C9FF" />
    </g>

    <!-- Card Typography -->
    <text x="26" y="330" fill="#71717A" font-family="'Space Grotesk', monospace" font-size="10" letter-spacing="2">
      EDITION 04 // LIMITED RELEASE
    </text>
    <text x="26" y="358" fill="#FFFFFF" font-family="'Space Grotesk', sans-serif" font-size="22" font-weight="700" letter-spacing="-0.5">
      Monolith Obsidian V4
    </text>
    <text x="26" y="380" fill="#A1A1AA" font-family="'Space Grotesk', sans-serif" font-size="12">
      Precision milled basalt chassis &amp; tactile switch matrix
    </text>

    <!-- Price and Purchase CTA -->
    <line x1="26" y1="400" x2="294" y2="400" stroke="rgba(255, 255, 255, 0.1)" />
    <text x="26" y="432" fill="#FFFFFF" font-family="'Space Grotesk', monospace" font-size="18" font-weight="700">
      $480.00
    </text>
    <!-- Bright CTA Button -->
    <rect x="180" y="412" width="114" height="34" rx="17" fill="url(#blue-accent)" />
    <text x="237" y="433" fill="#08080C" font-family="'Space Grotesk', sans-serif" font-size="11" font-weight="700" letter-spacing="1" text-anchor="middle">
      ACQUIRE ↗
    </text>
  </g>

  <!-- Right Product Card (Card C) -->
  <g transform="translate(810, 160)">
    <rect width="250" height="380" rx="14" fill="#0C0D12" stroke="rgba(255, 255, 255, 0.1)" stroke-width="1.2" />
    <rect x="20" y="20" width="210" height="210" rx="8" fill="#13141C" stroke="rgba(255, 255, 255, 0.06)" />
    <!-- Geometric Specimen Wireframe -->
    <rect x="75" y="75" width="100" height="100" rx="4" stroke="rgba(255, 255, 255, 0.2)" stroke-width="1.5" />
    <circle cx="125" cy="125" r="40" stroke="rgba(184, 201, 255, 0.45)" stroke-width="1.5" />
    <!-- Card Info -->
    <text x="24" y="260" fill="#71717A" font-family="'Space Grotesk', monospace" font-size="10" letter-spacing="1.5">SPECIMEN // 003</text>
    <text x="24" y="284" fill="#FFFFFF" font-family="'Space Grotesk', sans-serif" font-size="16" font-weight="600">Strata Lumbar</text>
    <text x="24" y="308" fill="#A1A1AA" font-family="'Space Grotesk', sans-serif" font-size="12">Ergonomic Dynamic Support</text>
    <line x1="24" y1="326" x2="226" y2="326" stroke="rgba(255, 255, 255, 0.08)" />
    <text x="24" y="352" fill="#FFFFFF" font-family="'Space Grotesk', monospace" font-size="14" font-weight="700">$290</text>
    <rect x="156" y="336" width="70" height="24" rx="12" fill="rgba(255, 255, 255, 0.08)" stroke="rgba(255, 255, 255, 0.2)" />
    <text x="191" y="351" fill="#FFFFFF" font-family="'Space Grotesk', sans-serif" font-size="10" font-weight="600" text-anchor="middle">VIEW</text>
  </g>

  <!-- Bottom Visual Info Bar -->
  <rect x="0" y="696" width="1200" height="54" fill="#0A0A0F" />
  <line x1="0" y1="696" x2="1200" y2="696" stroke="rgba(255, 255, 255, 0.09)" stroke-width="1" />

  <text x="36" y="728" fill="#FFFFFF" font-family="'Space Grotesk', sans-serif" font-size="13" font-weight="700" letter-spacing="2">
    MONOLITH ARCHIVE
  </text>
  <text x="240" y="728" fill="#71717A" font-family="'Space Grotesk', monospace" font-size="11" letter-spacing="1.5">
    E-COMMERCE · PRODUCT DESIGN · MINIMALIST STOREFRONT
  </text>
  <text x="1164" y="728" fill="#B8C9FF" font-family="'Space Grotesk', monospace" font-size="11" font-weight="600" letter-spacing="1.5" text-anchor="end">
    LIVE CASE STUDY ↗
  </text>
</svg>
